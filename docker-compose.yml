version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: fakenews-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secure_password}
      MYSQL_DATABASE: ${DB_NAME:-fakenews_db}
      MYSQL_USER: ${DB_USERNAME:-fakenews_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-fakenews_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secure_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - fakenews-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fakenews-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-fakenews_db}
      DB_USERNAME: ${DB_USERNAME:-fakenews_user}
      DB_PASSWORD: ${DB_PASSWORD:-fakenews_password}
      JWT_SECRET: ${JWT_SECRET:-AcademicFakeNewsSecretKeyMin32Chars2026!}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173,http://localhost:80"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - fakenews-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fakenews-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - fakenews-net

volumes:
  mysql_data:

networks:
  fakenews-net:
    driver: bridge
