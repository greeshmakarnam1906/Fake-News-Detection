server:
  port: 0

spring:
  application:
    name: fake-news-backend-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

app:
  jwt:
    secret: SecureTestJwtSecretKeyForAutomatedUnitAndIntegrationTestsOnly123!
    expiration-ms: 86400000
  cors:
    allowed-origins: "http://localhost:5173"
  ml:
    model-location: classpath:model.json
